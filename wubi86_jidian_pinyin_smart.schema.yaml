# Rime schema settings
# encoding: utf-8

schema:
  schema_id: wubi86_jidian_pinyin_smart
  name: "五笔拼音·延后排序版"
  version: "1.1"
  author:
    - 发明人 王永民先生
    - 基于 KyleBing 极点五笔方案优化
  description: |
    五笔 86 与拼音混输。
    输入过程中只读取静态词典，不查询或写入动态用户词典；
    已上屏候选异步追加到日志，批量生成延后排序词库后，
    下一次重新部署才应用新的候选顺序。
  dependencies:
    - pinyin_simp

switches:
  - name: full_shape
    reset: 0
    states: [ 半角, 全角 ]
  - name: extended_charset
    reset: 0
    states: [ 常用, 扩展 ]
  - name: ascii_punct
    reset: 1
    states: [ 中文标点, 英文标点 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - lua_processor@*wubi86_jidian_delayed_learning
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator@reverse_lookup
    - table_translator

speller:

translator:
  # 组合词典：原始极点词库 + 批量生成的延后排序词库
  dictionary: wubi86_jidian_smart_delayed
  enable_charset_filter: true
  enable_completion: true

  # 保持五笔输入的确定性，不启用整句拼接
  enable_sentence: false

  # 禁止在按键路径中查询、写入动态用户库，避免候选实时跳动和卡顿
  enable_user_dict: false
  enable_encoder: false
  encode_commit_history: false

# 输入编码同时进行拼音反查，实现五笔与拼音混输
abc_segmentor:
  extra_tags:
    - reverse_lookup

reverse_lookup:
  dictionary: pinyin_simp
  # 拼音反查同样关闭实时用户词频
  enable_user_dict: false
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

# Lua 只做轻量追加写入，不参与候选计算与排序
wubi86_jidian_delayed_learning:
  log_file: wubi86_jidian_delayed_learning.tsv
  max_code_length: 32

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
